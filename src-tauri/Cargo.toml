[package]
name = "embedded-learning-space"
version = "1.0.0"
description = "Embedded C Learning Space"
authors = ["Embedded C Roadmap"]
edition = "2021"

[lib]
name = "embedded_learning_space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embedded C — Roadmap</title>
<style>
/* Fonts are vendored locally (roadmap-source/fonts/, copied to src/fonts/ by
   the build) so the app really is offline — no fonts.googleapis.com on boot. */
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/ibm-plex-mono-400.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/ibm-plex-mono-500.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/ibm-plex-mono-600.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url("fonts/ibm-plex-sans-variable.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:400 600;font-display:swap;src:url("fonts/source-serif-4-variable.woff2") format("woff2")}
:root{
  --bg:#E9EDF1; --bg-2:#DFE5EB; --surface:#F7F9FB; --surface-2:#EEF2F6;
  --ink:#17232F; --ink-2:#4C5C6C; --ink-3:#7B8B99;
  --rule:#C3CDD6; --rule-soft:#D9E0E7;
  --accent:#9C5F06; --link:#125E75; --warn:#9B3624; --ok:#265C43;
  --violet:#5B48A8; --steel:#2C5A7A; --olive:#4F6127;
  --sans:"IBM Plex Sans",system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --shadow:0 1px 0 var(--rule);
  --rail:212px;   /* fixed left navigation; content breakpoints are measured off this */
}
/* Collapsed topic bodies are display:none already; content-visibility lets the
   browser also skip layout/paint work for the open ones scrolled out of view —
   the 163-topic list and the dashboard heatmap stay cheap (#20). */
.topic .detail,.stage-block,.lab-note{content-visibility:auto;contain-intrinsic-size:auto 400px}
/* Notices — notice() in 20_app.js. One implementation now covers the storage-full
   warning (sticky) and the labs' non-blocking errors (auto-dismiss), which used to
   be a window.alert(). Fixed to the foot of the window so they are reachable from
   any view; role=alert/status so the text is announced. */
.notice{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:1000;
  display:flex;gap:10px;align-items:flex-start;
  background:var(--warn);color:#fff;padding:10px 10px 10px 16px;border-radius:8px;
  font-family:var(--sans);font-size:13px;line-height:1.45;max-width:min(560px,80vw);
  box-shadow:0 6px 24px rgba(0,0,0,.28)}
.notice .notice-x{border:0;background:none;color:#fff;opacity:.85;cursor:pointer;
  font:600 16px/1 var(--sans);padding:2px 5px;border-radius:3px}
.notice .notice-x:hover,.notice .notice-x:focus-visible{opacity:1}
/* First tab stop on the page: jump past the fixed rail to the content column. */
.skip-link{position:absolute;left:10px;top:-44px;z-index:2000;background:var(--ink);
  color:var(--surface);padding:8px 14px;border-radius:0 0 4px 4px;text-decoration:none;
  font-family:var(--sans);font-size:13px;transition:top .12s ease}
.skip-link:focus{top:0}
#content:focus{outline:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101A24; --bg-2:#0C141C; --surface:#17242F; --surface-2:#1D2D3A;
    --ink:#DCE6EE; --ink-2:#93A6B6; --ink-3:#6C7F8F;
    --rule:#2A3B4A; --rule-soft:#213141;
    --accent:#E8A93C; --link:#63C2D9; --warn:#E0806E; --ok:#6FC49A;
    --violet:#A899E6; --steel:#7FB2D4; --olive:#AFC178;
    --shadow:0 1px 0 var(--rule);
  }
}
:root[data-theme="dark"]{
  --bg:#101A24; --bg-2:#0C141C; --surface:#17242F; --surface-2:#1D2D3A;
  --ink:#DCE6EE; --ink-2:#93A6B6; --ink-3:#6C7F8F;
  --rule:#2A3B4A; --rule-soft:#213141;
  --accent:#E8A93C; --link:#63C2D9; --warn:#E0806E; --ok:#6FC49A;
  --violet:#A899E6; --steel:#7FB2D4; --olive:#AFC178;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  padding-left:var(--rail);
}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* ---------- shell ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

header.masthead{
  border-bottom:1px solid var(--rule); background:var(--surface);
  position:sticky; top:0; z-index:40;
}
.mast-in{display:flex;gap:16px;align-items:center;padding:9px 0;flex-wrap:wrap}
.crumb{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.crumb .crumb-lab{font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.crumb strong{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.search{
  font-family:var(--mono);font-size:13px;padding:7px 10px;width:210px;
  background:var(--bg);border:1px solid var(--rule);border-radius:3px;color:var(--ink);
}
.search::placeholder{color:var(--ink-3)}
.btn{
  background:var(--bg);border:1px solid var(--rule);border-radius:3px;
  padding:7px 11px;font-size:13px;cursor:pointer;white-space:nowrap;
}
.btn:hover{border-color:var(--ink-3)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.meter{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.meter .bar{width:96px;height:6px;background:var(--rule-soft);border-radius:1px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .35s ease}

/* ---------- hero ---------- */
.hero{padding:36px 0 26px;border-bottom:1px solid var(--rule)}
.hero-grid{display:grid;grid-template-columns:300px 1fr;gap:44px;align-items:start}
.lede h2{
  font-family:var(--sans);font-size:clamp(26px,3.4vw,40px);line-height:1.1;
  font-weight:600;letter-spacing:-.02em;margin:0 0 14px;max-width:18ch;
}
.lede p{font-family:var(--serif);font-size:17px;line-height:1.62;color:var(--ink-2);max-width:62ch;margin:0 0 12px}
.lede p strong{color:var(--ink);font-weight:600}

/* memory map */
.mmap{border:1px solid var(--rule);background:var(--surface);border-radius:3px;overflow:hidden}
.mmap-head{
  display:flex;justify-content:space-between;padding:8px 10px;
  border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:11px;color:var(--ink-3)
}
.region{
  display:grid;grid-template-columns:78px 1fr;gap:10px;width:100%;
  text-align:left;background:none;border:0;border-bottom:1px solid var(--rule-soft);
  padding:9px 10px;cursor:pointer;align-items:center;
}
.region:last-child{border-bottom:0}
.region:hover,.region:focus-visible{background:var(--surface-2)}
.region .addr{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:-.02em}
.region .nm{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px}
.region .swatch{width:9px;height:18px;border-radius:1px;flex:none;transform-origin:top;}
.region .sub{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-top:2px}
.mmap-foot{padding:8px 10px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--rule)}

/* ---------- lens legend ---------- */
.lenses{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.lens-chip{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);
  background:var(--surface);border-radius:2px;padding:5px 9px;font-size:12.5px;cursor:pointer;
}
.lens-chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.lens-chip[aria-pressed="true"]{border-color:currentColor;background:var(--surface-2)}
.lens-note{font-size:12.5px;color:var(--ink-3);margin-top:10px;max-width:62ch}

/* ---------- stage nav ---------- */
.stagenav{
  position:sticky;top:52px;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--rule);
}
.stagenav .in{display:flex;gap:2px;overflow-x:auto;padding:0;scrollbar-width:thin}
.stagenav button{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:11px 12px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink-2)
}
.stagenav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* ---------- stages ---------- */
.stage{padding:40px 0 8px;border-bottom:1px solid var(--rule-soft)}
.stage-head{display:grid;grid-template-columns:78px 1fr;gap:18px;margin-bottom:22px}
.stage-num{font-family:var(--mono);font-size:30px;color:var(--accent);line-height:1;padding-top:2px}
.stage-head h3{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:-.01em}
.stage-head p{margin:0;font-family:var(--serif);font-size:16px;color:var(--ink-2);max-width:70ch;line-height:1.6}
.stage-meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:8px}
.stage-goals{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;max-width:78ch}
.stage-goals-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:5px 2px 5px 0}
.stage-goal{font-size:11.5px;color:var(--ink-2);border:1px solid var(--rule);background:var(--surface-2);border-radius:999px;padding:4px 8px}

/* ---------- topic rows ---------- */
.rows{border-top:1px solid var(--rule)}
.topic{border-bottom:1px solid var(--rule-soft)}
.topic.hit-hide{display:none}
.row{
  display:grid;grid-template-columns:78px 1fr auto;gap:18px;align-items:center;
  width:100%;background:none;border:0;padding:12px 6px;text-align:left;cursor:pointer;
}
.row:hover{background:var(--surface-2)}
.row .code{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.row .ttl{font-size:15.5px;font-weight:500;letter-spacing:-.005em}
.row .kick{display:block;font-family:var(--serif);font-size:13.5px;color:var(--ink-3);margin-top:3px;max-width:76ch;line-height:1.45}
.row .right{display:flex;align-items:center;gap:10px}
.pips{display:flex;gap:3px}
.pip{width:6px;height:6px;border-radius:50%;opacity:.85}
.done-mark{
  width:20px;height:20px;border:1px solid var(--rule);border-radius:2px;flex:none;
  display:grid;place-items:center;font-size:12px;color:transparent;background:var(--surface);
}
.topic[data-done="1"] .done-mark{background:var(--ok);border-color:var(--ok);color:#fff}
.topic[data-done="1"] .row .ttl{color:var(--ink-2)}
.topic[data-done="1"] .row .code{color:var(--ok)}

/* ---------- detail ---------- */
.detail{display:none;padding:6px 6px 30px}
.topic.open .detail{display:block}
.detail-grid{display:grid;grid-template-columns:78px 1fr;gap:18px}
.gutter{font-family:var(--mono);font-size:11px;color:var(--ink-3);line-height:1.6}
.gutter .k{display:block;color:var(--ink-3);margin-bottom:2px}
.gutter .v{display:block;color:var(--ink-2);margin-bottom:10px}

.lens{
  border-left:2px solid var(--l);padding:0 0 0 14px;margin:0 0 20px;
}
.lens h4{
  margin:0 0 5px;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--l);
}
.lens p{margin:0 0 9px;font-family:var(--serif);font-size:16px;line-height:1.65;max-width:70ch;color:var(--ink)}
.lens p:last-child{margin-bottom:0}
.lens code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:1px 4px;border-radius:2px}
.lens ul{margin:0 0 9px;padding-left:18px;font-family:var(--serif);font-size:16px;line-height:1.6;max-width:70ch}
.lens li{margin-bottom:4px}

pre.src{
  margin:0 0 20px;background:var(--surface);border:1px solid var(--rule);border-left:2px solid var(--steel);
  border-radius:0 3px 3px 0;padding:12px 14px;overflow-x:auto;
  font-family:var(--mono);font-size:12.9px;line-height:1.62;color:var(--ink);
}
/* hl() output (see 20_app.js). The same five token classes apply wherever
   highlighted code appears: the compiler-diff source panes (pre.src), the real
   tool artifacts in the Compilation Path bench (pre.hl), and interview question
   code blocks (.ivcode). */
pre.src .c,pre.hl .c,.ivcode .c{color:var(--ink-3)}
pre.src .k,pre.hl .k,.ivcode .k{color:var(--violet)}
pre.src .s,pre.hl .s,.ivcode .s{color:var(--ok)}
pre.src .n,pre.hl .n,.ivcode .n{color:var(--accent)}
pre.src .p,pre.hl .p,.ivcode .p{color:var(--steel)}
pre.hl{margin:0;padding:10px 12px;overflow:auto;background:var(--bg);border:1px solid var(--rule);
  font:11.5px/1.55 var(--mono);color:var(--ink);white-space:pre}
.srccap{font-size:12px;color:var(--ink-3);margin:-14px 0 20px;font-family:var(--sans)}

.check{
  background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:12px 14px;margin:0 0 18px;max-width:70ch;
}
.topic-cue{
  background:var(--surface-2);border:1px solid var(--rule-soft);border-left:3px solid var(--link);border-radius:3px;
  padding:11px 13px;margin:0 0 18px;max-width:70ch;
}
.topic-cue-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.045em;color:var(--ink-3)}
.topic-cue-head span:first-child{color:var(--link);font-weight:600}
.topic-cue p{margin:0;font-family:var(--serif);font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.topic-visual{max-width:70ch;margin:0 0 20px;padding:11px 13px;border:1px solid var(--rule-soft);background:var(--surface)}
.topic-visual-head{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:9px}
.tv-caption{font-family:var(--serif);font-size:12.5px;line-height:1.45;color:var(--ink-3);margin-top:9px}
.tv-bits,.tv-hex,.tv-twos,.tv-signext,.tv-bitops,.tv-shift,.tv-scale,.tv-float,.tv-endian,.tv-preproc,.tv-lma,.tv-memarray,.tv-pointer,.tv-ptrarith,.tv-struct,.tv-padding,.tv-concurrency,.tv-rmw,.tv-barrier,.tv-stack,.tv-vectors,.tv-isr,.tv-ring{font-family:var(--mono);font-size:11px}
.tv-powers,.tv-cells,.tv-labels{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;text-align:center}
.tv-powers span,.tv-labels span{color:var(--ink-3);font-size:9px}.tv-cells b{display:block;padding:7px 0;border:1px solid var(--rule);background:var(--surface-2);font-weight:600}
.tv-hex{text-align:center}.tv-hex>div:first-child strong{font-size:18px}.tv-arrow{color:var(--link);font-size:16px;margin:4px 0}.tv-nibbles{display:flex;justify-content:center;gap:8px}.tv-nibbles span{padding:5px 8px;border:1px solid var(--rule);background:var(--surface-2)}
.tv-twos>div,.tv-signext>div,.tv-bitops>div{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin:4px 0}.tv-twos code,.tv-signext code,.tv-bitops code{padding:5px 8px;background:var(--surface-2);border:1px solid var(--rule)}.tv-result strong{color:var(--accent)}
.tv-shift-row,.tv-scale-main,.tv-flow,.tv-link,.tv-startup,.tv-isr,.tv-rmw>div:first-child,.tv-barrier>div:first-child{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.tv-shift-row code,.tv-scale-main strong{padding:6px 9px;border:1px solid var(--rule);background:var(--surface-2)}
.tv-scale-bar{height:8px;border:1px solid var(--rule);background:var(--surface-2);margin-top:8px}.tv-scale-bar i{display:block;height:100%;background:var(--accent)}
.tv-float-fields{display:grid;grid-template-columns:1fr 8fr 23fr;gap:4px}.tv-float-fields span{padding:7px 5px;text-align:center;border:1px solid var(--rule);background:var(--surface-2)}.tv-float-fields .s{border-top:2px solid var(--warn)}.tv-float-fields .e{border-top:2px solid var(--violet)}.tv-float-fields .m{border-top:2px solid var(--link)}
.tv-endian>div{display:grid;grid-template-columns:80px repeat(4,1fr);gap:3px;margin:3px 0}.tv-endian b,.tv-endian code{padding:5px;text-align:center;border:1px solid var(--rule);background:var(--surface-2)}
.tv-flow span,.tv-link span,.tv-link strong,.tv-startup span,.tv-startup strong,.tv-isr span,.tv-isr strong{padding:6px 8px;border:1px solid var(--rule);background:var(--surface-2)}.tv-flow i,.tv-link i,.tv-startup i,.tv-isr i{color:var(--link);font-style:normal}.tv-preproc>div:first-child,.tv-preproc>div:last-of-type{display:grid;gap:4px}.tv-preproc code{padding:5px 8px;border:1px solid var(--rule);background:var(--surface-2)}
.tv-obj>div,.tv-sections>div,.tv-struct>div,.tv-vectors>div{display:grid;grid-template-columns:110px 1fr 120px;gap:8px;align-items:center;margin:4px 0}.tv-obj>div{grid-template-columns:110px 1fr}.tv-obj b,.tv-sections b,.tv-sections em,.tv-struct b,.tv-vectors span{padding:5px 7px;border:1px solid var(--rule);background:var(--surface-2);font-style:normal}.tv-lma{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.tv-memory-col{padding:9px;border:1px solid var(--rule);background:var(--surface-2);text-align:center}.tv-memory-col strong,.tv-memory-col span{display:block}.tv-memory-col span{margin-top:4px;color:var(--ink-3)}
.tv-pointer>div:first-child,.tv-ptrarith>div{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;align-items:center}.tv-array{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.tv-array span,.tv-array b,.tv-ptrarith>div>*{padding:5px;text-align:center;border:1px solid var(--rule);background:var(--surface-2)}.tv-array span{font-size:9px;color:var(--ink-3)}.tv-ptrarith>div{grid-template-columns:90px 1fr}.tv-padding{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.tv-padding>div{padding:7px;text-align:center;border:1px solid var(--rule);background:var(--surface-2)}.tv-padding .pad{border-style:dashed;color:var(--warn)}
.tv-concurrency{text-align:center}.tv-concurrency>div:first-child{display:flex;justify-content:center;gap:12px;align-items:center}.tv-concurrency .tv-line{color:var(--link);font-size:16px}.tv-rmw>div:first-child span{padding:6px 9px;border:1px solid var(--rule);background:var(--surface-2)}.tv-interrupt{margin-top:7px;padding:5px;text-align:center;border:1px dashed var(--warn);color:var(--warn)}.tv-stack{display:flex;justify-content:center}.tv-stack>div:first-child{display:grid;gap:3px;width:min(100%,300px)}.tv-stack b,.tv-stack span{padding:6px;border:1px solid var(--rule);background:var(--surface-2);text-align:center}.tv-vectors>div{grid-template-columns:35px 1fr}.tv-vectors b{padding:5px;text-align:center}.tv-ring-track{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}.tv-ring-track b{padding:6px;text-align:center;border:1px solid var(--rule);background:var(--surface-2)}.tv-ring-ptrs{display:flex;justify-content:space-between;margin-top:5px;color:var(--accent)}

.topic-links{max-width:70ch;margin:0 0 20px;padding:10px 0 0;border-top:1px solid var(--rule-soft)}
.topic-links h4{margin:0 0 7px;font-family:var(--mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.topic-links a{display:block;text-decoration:none;border:1px solid var(--rule-soft);background:var(--surface);padding:8px 10px;margin:5px 0;color:var(--ink)}
.topic-links a:hover{border-color:var(--link);background:var(--surface-2)}
.topic-links a span{display:block;font-size:12px;font-weight:600}
.topic-links a small{display:block;margin-top:3px;font-family:var(--serif);font-size:12.5px;line-height:1.4;color:var(--ink-3)}
.predict{
  background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:3px;
  padding:12px 14px;margin:0 0 18px;max-width:70ch;
}
.predict-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.predict-head span:first-child{color:var(--accent);font-weight:600}
.predict p{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.6}
.predict-answer{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule);color:var(--ink-2);font-family:var(--serif);font-size:15px;line-height:1.6}
.predict.shown .predict-answer{display:block}
.predict button{margin-top:9px;background:none;border:1px solid var(--rule);border-radius:2px;padding:4px 9px;font-size:12px;cursor:pointer}
.watch{background:var(--surface-2);border:1px solid var(--rule-soft);border-left:2px solid var(--warn);padding:10px 13px;margin:0 0 20px;max-width:70ch}
.watch h4{margin:0 0 4px;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--warn)}
.watch p{margin:0;font-family:var(--serif);font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.check h4{margin:0 0 6px;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--ink-3)}
.check p{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.6}
.check .ans{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule);color:var(--ink-2)}
.check.shown .ans{display:block}
.check button{margin-top:9px;background:none;border:1px solid var(--rule);border-radius:2px;padding:4px 9px;font-size:12px;cursor:pointer}

.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

/* lens-only mode */
body.lensmode .row .kick{display:none}
body.lensmode .lens[data-hidden="1"]{display:none}
body.lensmode pre.src,body.lensmode .check,body.lensmode .predict,body.lensmode .watch,body.lensmode .srccap{display:none}

/* ---------- misc ---------- */
.empty{padding:40px 6px;color:var(--ink-3);font-family:var(--serif);font-size:16px}
footer.foot{padding:34px 0 56px;color:var(--ink-3);font-size:13px;line-height:1.7}
footer.foot code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 4px;border-radius:2px}
.hr{height:1px;background:var(--rule);margin:0}

/* Content-level breakpoints. The rail takes --rail out of the viewport before any
   content starts, so every width rule in this file is written as
   (intended content width + 212px) - a rule that wants a 900px content column fires
   at 1112px of viewport. Written as literals because media queries take no calc().
   The one exception is the rail's own 820px rule below, which is about the window. */
@media (max-width:1112px){
  .panel,.panel.w8,.panel.w6{grid-column:span 12}
  #d-labs{grid-template-columns:1fr}
  .dash-lede{grid-template-columns:1fr}
  .hero-grid{grid-template-columns:1fr;gap:26px}
  .stage-head,.detail-grid{grid-template-columns:1fr;gap:8px}
  .stage-num{font-size:22px}
  .row{grid-template-columns:56px 1fr auto;gap:10px;padding:12px 2px}
  .gutter{display:flex;flex-wrap:wrap;gap:14px}
  .gutter .v{margin-bottom:0}
  .search{width:150px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
.swatch{animation:grow .5s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ---------- left rail: one <details> per section ----------
   ".viewsw button" is a contract, not a style hook: setView() syncs aria-pressed
   across it and boot wires the click handlers through it. Renaming it would leave
   navigation quietly dead rather than loudly broken. */
.rail{
  position:fixed;top:0;bottom:0;left:0;width:var(--rail);z-index:60;
  display:flex;flex-direction:column;
  background:var(--surface);border-right:1px solid var(--rule);
  overflow-y:auto;overscroll-behavior:contain;
}
.rail-brand{padding:14px 14px 13px;border-bottom:1px solid var(--rule-soft)}
.rail-brand h1{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.rail-brand .rev{display:block;margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.rail-nav{flex:1;padding:9px 8px 12px}
.viewsw{display:block}
.rgroup{margin:0 0 1px}
.rgroup>summary{
  list-style:none;display:flex;align-items:center;gap:7px;cursor:pointer;
  padding:7px 8px;border-radius:3px;
  font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
}
.rgroup>summary::-webkit-details-marker{display:none}
.rgroup>summary::before{content:"\25B8";font-size:8px;transition:transform .16s ease}
.rgroup[open]>summary::before{transform:rotate(90deg)}
.rgroup>summary:hover{color:var(--ink-2);background:var(--surface-2)}
.rgroup>summary .rcount{margin-left:auto;font:400 9.5px var(--mono);letter-spacing:0;color:var(--ink-3)}
.ritems{display:flex;flex-direction:column;gap:1px;padding:2px 0 7px}
.viewsw button{
  display:block;width:100%;text-align:left;background:none;border:0;border-radius:3px;
  padding:7px 9px 7px 11px;font:inherit;font-size:13.5px;line-height:1.3;
  color:var(--ink-2);cursor:pointer;
}
.viewsw button:hover{background:var(--surface-2);color:var(--ink)}
.viewsw button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
.rail-foot{padding:11px 10px 13px;border-top:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:9px}
.rail-foot .meter{font-size:11px}
.rail-foot .meter .bar{flex:1;width:auto;min-width:0}
.rail-btns{display:flex;flex-direction:column;gap:5px}
.rail-btns .btn{width:100%;padding:6px 8px;font-size:11.5px;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
.rail-btns .btn:hover{background:var(--surface-2)}
.view[hidden]{display:none}

/* ---------- bookmark ---------- */
.bm{width:22px;height:22px;border:0;background:none;padding:0;cursor:pointer;color:var(--ink-3);
    display:grid;place-items:center;font-size:15px;line-height:1;opacity:.45}
.bm:hover{opacity:1}
.topic[data-bm="1"] .bm{color:var(--accent);opacity:1}

/* ---------- notes ---------- */
.notes{border:1px solid var(--rule);border-left:2px solid var(--accent);background:var(--surface);
       border-radius:0 3px 3px 0;padding:12px 14px;margin:0 0 20px;max-width:70ch}
.notes h4{margin:0 0 8px;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--ink-3);
          display:flex;justify-content:space-between;align-items:center;gap:10px}
.notes h4 span.saved{color:var(--ok);opacity:0;transition:opacity .3s}
.notes h4 span.saved.on{opacity:1}
/* Screen-reader confirmation for the visual "saved" flash (#19) */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.notes textarea{width:100%;min-height:150px;font-family:var(--mono);font-size:13px;line-height:1.6;
  background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:10px;resize:vertical}
.notes .nbtns{display:flex;gap:8px;margin-top:9px}
.notes .nbtns button{background:var(--bg);border:1px solid var(--rule);border-radius:2px;padding:5px 10px;font-size:12px;cursor:pointer}
.notes-empty{color:var(--ink-3);font-size:13.5px;font-family:var(--serif)}
/* A lab stage's journal is the notes box wearing the lab's own accent, with a shorter
   well: a stage should cost a paragraph, not an essay. It lives in a host the lab's
   renderer does not own, so redrawing a stage cannot throw away a textarea mid-sentence. */
.jrhost{margin-top:2px}
.notes.jrbox{border-left-color:var(--steel)}
.notes.jrbox textarea{min-height:104px}
.md{font-family:var(--serif);font-size:15.5px;line-height:1.62}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{font-family:var(--sans);font-size:15px;font-weight:600;margin:14px 0 6px}
.md p{margin:0 0 9px}
.md code{font-family:var(--mono);font-size:.85em;background:var(--surface-2);padding:1px 4px;border-radius:2px}
.md pre{background:var(--bg);border:1px solid var(--rule);border-radius:3px;padding:10px;overflow-x:auto;
        font-family:var(--mono);font-size:12.5px;line-height:1.55;margin:0 0 10px}
.md pre code{background:none;padding:0}
.md ul,.md ol{margin:0 0 10px;padding-left:20px}
.md li{margin-bottom:3px}
.md blockquote{border-left:2px solid var(--rule);padding-left:10px;margin:0 0 10px;color:var(--ink-2)}
.md hr{border:0;border-top:1px solid var(--rule);margin:14px 0}
.topic[data-note="1"] .row .code::after{content:"\2022";color:var(--accent);margin-left:5px}

/* ---------- dashboard ---------- */
.dash{padding:34px 0 64px}
.dash-lede{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:26px}
.dash-lede h2{margin:0;font-size:clamp(22px,3vw,32px);font-weight:600;letter-spacing:-.02em}
.dash-lede p{margin:8px 0 0;font-family:var(--serif);font-size:16px;color:var(--ink-2);max-width:56ch}
.dashgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.panel{grid-column:span 4;border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:16px 18px}
.panel.w8{grid-column:span 8}
.panel.w6{grid-column:span 6}
.panel.w12{grid-column:span 12}
.panel h3{margin:0 0 14px;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--ink-3)}
.bigstat{font-family:var(--mono);font-size:46px;line-height:.95;letter-spacing:-.03em}
.bigstat small{font-size:15px;color:var(--ink-3);margin-left:6px;letter-spacing:0}
.substat{font-size:13px;color:var(--ink-2);margin-top:10px;line-height:1.6}
.stagebar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 58px;gap:12px;align-items:center;margin-bottom:9px;font-size:13px}
.stagebar:last-child{margin-bottom:0}
.stagebar .tr{height:8px;background:var(--rule-soft);border-radius:1px;overflow:hidden}
.stagebar .tr i{display:block;height:100%;background:var(--accent);transition:width .5s ease}
.stagebar .nn{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:right}
/* dashboard: the benches — one graded row per lab, two across a full-width panel */
#d-labs{display:grid;grid-template-columns:1fr 1fr;column-gap:34px}
.stagebar.labrow{grid-template-columns:minmax(120px,150px) 1fr 54px;gap:3px 12px;margin-bottom:13px}
.lablink{background:none;border:0;padding:0;text-align:left;font:inherit;color:var(--ink-2);cursor:pointer}
.lablink:hover{color:var(--accent)}
.labcap{grid-column:1/-1;margin:0;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.labcap b{font-weight:500;color:var(--ink-2)}
.heat{display:flex;gap:3px;flex-wrap:wrap}
.heat span{width:13px;height:13px;border-radius:2px;background:var(--rule-soft)}
.heatkey{font-size:12px;color:var(--ink-3);margin-top:10px}
.list{list-style:none;margin:0;padding:0;max-height:250px;overflow-y:auto}

          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.panelbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.panelbtns button{background:var(--bg);border:1px solid var(--rule);border-radius:2px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.panelbtns button:hover{border-color:var(--ink-3)}

/* ---------- mosaic ---------- */
.mos{padding:34px 0 64px}
.mos-lede{margin-bottom:20px}
.mos-lede h2{margin:0;font-size:clamp(22px,3vw,32px);font-weight:600;letter-spacing:-.02em}
.mos-lede p{margin:8px 0 0;font-family:var(--serif);font-size:16px;color:var(--ink-2);max-width:64ch}
.mosbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:16px 0}
.mosbar .n{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.mosframe{position:relative;border:1px solid var(--rule);border-radius:3px;background:#0B141C;overflow:hidden}
svg.mosaic{display:block;width:100%;height:auto}
.cover{fill:var(--surface);stroke:var(--rule);stroke-width:1.1;transition:opacity .7s ease}
:root[data-theme="light"] .cover{fill:#D7DDE3}
.cover.on{opacity:0}
.seam{fill:none;stroke:#0B141C;stroke-width:.9;opacity:.5;pointer-events:none}
.hitp{fill:transparent;cursor:pointer}
.hitp:hover{fill:rgba(232,169,60,.14)}
.mostip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--rule);
  border-radius:3px;padding:6px 9px;font-size:12.5px;max-width:250px;opacity:0;transition:opacity .15s;z-index:5}
.mostip.on{opacity:1}
.mostip .c{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:block}
.mosdone{text-align:center;padding:18px 0 0;font-family:var(--serif);font-size:16px;color:var(--ink-2)}

/* The rail is fixed down to 820px of viewport; below that there is no room for
   both a rail and a content column, so it degrades to a stacked header. Only
   reachable by opening the built HTML in a narrow browser window - the app itself
   will not shrink past 1050px. */
@media (max-width:820px){
  body{padding-left:0}
  .rail{position:static;width:auto;border-right:0;border-bottom:1px solid var(--rule)}
  .ritems{flex-direction:row;flex-wrap:wrap;gap:2px}
  .viewsw button{width:auto;font-size:12.5px}
}



/* ---------- practice sub-nav ---------- */
.subnav{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:24px}
.subnav button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 4px;margin-right:18px;
  font-size:14px;cursor:pointer;color:var(--ink-2)}
.subnav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pv-lede{margin-bottom:20px}
.pv-lede h2{margin:0 0 6px;font-size:clamp(20px,2.6vw,28px);font-weight:600;letter-spacing:-.02em}
.pv-lede p{margin:0;font-family:var(--serif);font-size:15.5px;color:var(--ink-2);max-width:66ch;line-height:1.6}
.subview[hidden]{display:none}

/* ---------- explain-back gate ---------- */
.notes.gate{border-left-color:var(--warn)}
.gate-msg{display:none;font-size:12.5px;color:var(--warn);font-family:var(--sans);margin:0 0 9px}
.gate-msg.on{display:block}

.nbtns button.mark-learned{background:var(--ok);border-color:var(--ok);color:#fff;display:none}
.nbtns button.mark-learned.show{display:inline-block}

/* ---------- interview mode ---------- */
.ivbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.ivbar select{font-family:var(--sans);font-size:13px;padding:6px 8px;background:var(--bg);
  border:1px solid var(--rule);border-radius:3px;color:var(--ink)}
.ivtimer{font-family:var(--mono);font-size:13px;color:var(--ink-2);margin-left:auto;padding:6px 10px;
  border:1px solid var(--rule);border-radius:3px;background:var(--surface)}

.ivcov{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:24px}

.ivcov .pct{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.ivgrid{display:grid;grid-template-columns:260px 1fr;gap:22px}
.ivlist{border:1px solid var(--rule);border-radius:3px;max-height:600px;overflow-y:auto}
.ivlist button{display:block;width:100%;text-align:left;background:var(--surface);border:0;
  border-bottom:1px solid var(--rule-soft);padding:10px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.ivlist button:last-child{border-bottom:0}
.ivlist button:hover{background:var(--surface-2)}
.ivlist button[aria-current="true"]{background:var(--ink);color:var(--surface)}
.ivlist .tag{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px}

.ivcard{border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:20px 22px}

  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule)}
.ivprompt{font-family:var(--serif);font-size:17px;line-height:1.55;margin:0 0 14px}
.ivcode{background:var(--bg);border:1px solid var(--rule);border-left:2px solid var(--steel);border-radius:0 3px 3px 0;
  padding:12px 14px;font-family:var(--mono);font-size:12.9px;line-height:1.6;overflow-x:auto;margin:0 0 14px;white-space:pre}

  background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:10px;resize:vertical;margin-bottom:12px}

.ivrubric li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--rule-soft);font-size:14px}
.ivrubric li:last-child{border-bottom:0}
.ivrubric input{margin-top:4px;flex:none}
.ivrubric .lenschip{font-family:var(--mono);font-size:10px;flex:none;padding:1px 6px;border-radius:2px;
  border:1px solid currentColor;align-self:flex-start;margin-top:2px}
.ivmodel{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink-2);
  background:var(--bg);border:1px solid var(--rule);border-radius:3px;padding:12px 14px;margin:0}
.ivnav{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.ivnav span{font-family:var(--mono);font-size:12px;color:var(--ink-3)}

/* ---------- memory-map lab ---------- */
.labgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}

  border:1px solid var(--rule);border-radius:3px;color:var(--ink)}

  border:1px solid var(--rule);border-radius:3px}

/* ---------- linker + startup lab ---------- */
.ldbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px;border:1px solid var(--rule);background:var(--surface);border-radius:3px;margin-bottom:16px}

.ldscenarios button{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:5px 8px;cursor:pointer;color:var(--ink-2)}
.ldscenarios button:hover,.ldscenarios button[aria-current="true"]{border-color:var(--ink-3);color:var(--ink);background:var(--surface-2)}
.ldactions{display:flex;gap:7px;flex-wrap:wrap}
.ldpipeline{display:flex;align-items:stretch;gap:8px;margin:0 0 18px;overflow-x:auto;padding-bottom:2px}
.ldstage{min-width:142px;border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:9px 11px;transition:.2s}
.ldstage span{font-family:var(--mono);font-size:10px;color:var(--ink-3);display:block;margin-bottom:4px}
.ldstage b{display:block;font-size:13px;margin-bottom:2px}.ldstage small{font-size:11px;color:var(--ink-3)}
.ldstage.on{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.ldarrow{display:flex;align-items:center;color:var(--ink-3);font-family:var(--mono);font-size:18px}
.ldgrid,.ldmapgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.ldpanel{border:1px solid var(--rule);background:var(--surface);border-radius:3px;overflow:hidden}
.ldpanel-head{display:flex;justify-content:space-between;gap:10px;padding:8px 11px;background:var(--surface-2);border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.ldcode{margin:0;padding:13px 14px;background:var(--bg);font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre;overflow:auto;min-height:250px;color:var(--ink)}
.ldfacts{border-top:1px solid var(--rule);padding:8px 12px}.ldfact{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule-soft);font-size:12px}.ldfact:last-child{border-bottom:0}.ldfact b{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}.ldfact span{color:var(--ink-2)}
.ldsymbols{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--rule)}.ldsymbols span{font-family:var(--mono);font-size:10.5px;border:1px solid var(--rule);padding:3px 6px;border-radius:2px;background:var(--bg)}
.ldsymbols b{color:var(--accent);font-weight:500}
.ldrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--rule-soft);font-family:var(--mono);font-size:11.5px}.ldrow:last-child{border-bottom:0}.ldrow span{min-width:0}.ldrow b{display:block;color:var(--ink)}.ldrow small{display:block;color:var(--ink-3);font-family:var(--sans);font-size:11px;margin-top:2px}.ldrow em,.ldrow i{font-style:normal;color:var(--ink-2);white-space:nowrap}.ldrow em{color:var(--accent)}
.ldstartup{border:1px solid var(--rule);background:var(--surface);border-radius:3px;overflow:hidden;margin-bottom:16px}.ldboot{display:grid;grid-template-columns:repeat(3,1fr)}.ldbootstep{padding:12px;border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);min-height:92px;opacity:.65}.ldbootstep:nth-child(3n){border-right:0}.ldbootstep.done{opacity:1;background:var(--surface-2)}.ldbootstep>span{font-family:var(--mono);font-size:10px;color:var(--ink-3);display:block;margin-bottom:4px}.ldbootstep b{display:block;font-size:12.5px;margin-bottom:4px}.ldbootstep small{font-family:var(--serif);font-size:12.5px;line-height:1.45;color:var(--ink-2)}.ldnote{padding:10px 12px;margin:0;font-size:12px;color:var(--ink-3);line-height:1.5}
.ldchallenge{border-left:2px solid var(--steel);background:var(--surface);border:1px solid var(--rule);border-left-width:3px;border-radius:3px;padding:12px 14px}.ldchallenge b{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.ldchallenge p{margin:5px 0 0;font-family:var(--serif);font-size:14px;line-height:1.55;color:var(--ink-2)}
.ldguide{margin-bottom:16px}.ldguide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}.ldguide-grid>div{padding:12px;border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft)}.ldguide-grid>div:nth-child(3n){border-right:0}.ldguide-grid b{font-family:var(--mono);font-size:11px}.ldguide-grid p{margin:5px 0 0;font-family:var(--serif);font-size:13px;line-height:1.45;color:var(--ink-2)}.ldguide-grid code{font-family:var(--mono);font-size:.9em;color:var(--ink)}

/* ---------- failure-mode graph ---------- */
.graphview{padding:34px 20px 48px}
.graph-lede{margin-bottom:18px}
.graph-lede h2{margin:0 0 7px;font-size:26px;letter-spacing:-.015em}
.graph-lede p{font-family:var(--serif);font-size:16px;line-height:1.6;color:var(--ink-2);max-width:78ch;margin:0}
.gtoolbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:12px;border:1px solid var(--rule);background:var(--surface);border-radius:3px}
.glabel{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:5px}
.gcontrols,.gclusters{display:flex;gap:6px;flex-wrap:wrap}
.gk,.gc-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--rule);border-radius:3px;padding:5px 8px;font-size:12px;cursor:pointer}
.gk[aria-pressed="true"],.gc-chip[aria-pressed="true"]{border-color:currentColor;background:var(--surface-2)}
.gk .sw{width:18px;height:0;border-top:2px solid var(--ink-3)}
.gk .sw.prereq{border-top-style:solid}.gk .sw.pattern{border-top-style:dashed;border-color:var(--warn)}
.gk .sw.related{border-top-style:dotted;border-color:var(--link)}.gk .sw.mention{border-top-style:dotted;opacity:.45}
.gclusters{margin-top:12px}.gc-chip .dot{width:8px;height:8px;border-radius:50%}
.gblurb{margin:9px 0 14px;font-family:var(--serif);font-size:14px;color:var(--ink-2)}.gblurb b{font-family:var(--mono);font-size:12px}.graph-reset.needs-reset{box-shadow:0 0 0 2px var(--warn);font-weight:700;position:relative}.graph-reset.needs-reset:after{content:"Start here";position:absolute;left:50%;top:100%;transform:translate(-50%,6px);font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);white-space:nowrap}
.graphgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
.gframe{position:relative;min-height:660px;border:1px solid var(--rule);background:var(--surface);border-radius:3px;overflow:hidden;touch-action:none}
svg.graph{display:block;width:100%;height:auto;min-height:660px;user-select:none}
.gedge{stroke:var(--rule);stroke-width:1;opacity:.55}.gedge.k-prereq{stroke:var(--ink-2);opacity:.42}.gedge.k-pattern{stroke-width:1.4;stroke-dasharray:6 5;opacity:.72}.gedge.k-related{stroke:var(--link);stroke-dasharray:2 5;opacity:.42}.gedge.k-mention{stroke:var(--ink-3);stroke-dasharray:1 6;opacity:.22}.gedge.hide{display:none}
.gnode,.ghub{cursor:pointer}.gnode text,.ghub text{font-family:var(--mono);font-size:9px;fill:var(--ink-3);text-anchor:middle;pointer-events:none}.gnode text.nlabel{display:none}.gnode:hover text.nlabel,.gnode.sel text.nlabel{display:block}.ghub text{font-size:9.5px;font-weight:600}
.gnode .core{stroke:var(--surface);stroke-width:1.5}.gnode:hover .core,.gnode.sel .core{stroke:var(--ink);stroke-width:2.2}.gnode.dim,.ghub.dim,.gedge.dim{opacity:.08}.gedge.hot{opacity:.95;stroke-width:2}.ghub.hot{opacity:1}
/* Keyboard traversal of the graph (bindKeys in 40_graph.js). SVG has no reliable
   outline, so the focused node announces itself through its own core ring and
   label instead. */
.gnode:focus-visible{outline:none}.gnode:focus-visible .core{stroke:var(--accent);stroke-width:2.6}
.gnode:focus-visible text.nlabel{display:block}
.gtip{display:none;position:absolute;z-index:4;max-width:270px;padding:8px 10px;border:1px solid var(--rule);background:var(--bg-2);box-shadow:0 4px 18px rgba(0,0,0,.12);border-radius:3px;font-size:12px;pointer-events:none}.gtip.on{display:block}.gtip .c{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.gpanel{min-height:220px;border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:14px;position:sticky;top:72px}.gpanel h3{margin:2px 0 4px;font-size:17px}.gpanel h5{margin:16px 0 5px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}.gpanel ul{list-style:none;padding:0;margin:0}.gpanel li{margin:0 0 8px;font-size:12.5px}.gpanel a{cursor:pointer}.gpanel .why{display:block;color:var(--ink-3);font-family:var(--serif);line-height:1.45;margin-top:2px}.gp-code{font-family:var(--mono);font-size:11px;color:var(--accent)}.gp-kick{font-family:var(--serif);font-size:13.5px;line-height:1.5;color:var(--ink-2)}
@media(max-width:1112px){.graphgrid{grid-template-columns:1fr}.gpanel{position:static}.gframe,svg.graph{min-height:520px}}

/* ---------- fault triage ---------- */
.faultbar{display:flex;gap:14px;align-items:center;margin-bottom:18px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.faultbar b{color:var(--ink)}
.faultcard{border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:20px 22px}
.faultcard h3{margin:0 0 8px;font-size:17px;font-weight:600}
.faultcard .ctx{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink-2);margin:0 0 14px}
.regdump{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.regdump .r{border:1px solid var(--rule);background:var(--bg);border-radius:3px;padding:7px 9px}
.regdump .r .k{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.regdump .r .v{display:block;font-family:var(--mono);font-size:13px;color:var(--accent);margin-top:2px;word-break:break-all}
.decode{list-style:none;margin:0 0 16px;padding:0;font-family:var(--mono);font-size:12px;color:var(--ink-2);

/* linker lab — stage 8 sandbox */
.lks-head{display:grid;grid-template-columns:180px 128px 1fr 108px;gap:10px;padding:0 10px 6px;border-bottom:1px solid var(--rule-soft);font:600 9px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.lks-row{display:grid;grid-template-columns:180px 128px 1fr 108px;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--rule-soft)}
.lks-row:last-child{border-bottom:0}
.lks-sec{font:600 11.5px var(--mono);color:var(--ink)}
.lks-kind{display:inline-block;padding:3px 7px;border:1px solid var(--rule-soft);background:var(--surface);font:600 9px var(--mono);text-transform:uppercase;color:var(--ink-3)}
.lks-reg button{border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);font:600 9.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:5px 9px;cursor:pointer}
.lks-reg button+button{margin-left:-1px}
.lks-reg button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lks-reg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lks-foot{font:10.5px var(--mono);color:var(--ink-2);line-height:1.4}
.lks-bars{display:grid;gap:12px;margin-top:14px}
.lks-bar b{display:block;font:600 9px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:5px}
.lks-track{height:24px;border:1px solid var(--rule);background:var(--surface);overflow:hidden}
.lks-fill{display:block;height:100%;background:var(--ok);min-width:2px}
.lks-fill.over{background:var(--warn)}
.lks-bar small{display:block;margin-top:4px;font:10.5px var(--mono);color:var(--ink-2)}
.lks-reserve{background:repeating-linear-gradient(135deg,var(--rule-soft),var(--rule-soft) 4px,var(--surface),var(--surface) 8px)}
.lks-diag{display:grid;gap:8px}
.lks-diag-row{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:9px;border:1px solid var(--rule-soft);background:var(--surface);align-items:start}
.lks-tag{font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:3px 6px;border:1px solid currentColor;white-space:nowrap}
.lks-tag.error{color:var(--warn)}.lks-tag.warn{color:var(--accent)}.lks-tag.ok{color:var(--ok)}
.lks-diag-row span{font-size:11.5px;line-height:1.5;color:var(--ink-2)}
.lks-diag-row code{color:var(--ink);font:600 10.5px var(--mono)}
.lks-reserve-row{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;align-items:center}
.lks-reserve-row label{display:flex;align-items:center;gap:7px;font:600 9px var(--mono);text-transform:uppercase;color:var(--ink-3)}
.lks-num{width:88px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:11px var(--mono);padding:5px 7px}
.lks-num:focus{outline:1px solid var(--accent);outline-offset:-1px}
#lks-reset{margin-left:auto}
.lks-script .linklab-code{white-space:pre;overflow-x:auto}
.lks-chip{display:inline-block;margin-left:8px;padding:3px 8px;border:1px solid var(--rule);font:600 9px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.lks-chip.ok{border-color:var(--ok);color:var(--ok)}.lks-chip.bad{border-color:var(--warn);color:var(--warn)}
/* the annotated startup.s listing */
.linklab-asmsub{margin:0 0 12px;color:var(--ink-2);font-size:13px;line-height:1.55}
.linklab-asmwrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
.linklab-asm{max-height:430px;overflow:auto;border:1px solid var(--rule);background:var(--surface-2);padding:6px 0;font:12px/1.6 var(--mono)}
.linklab-asmline{display:block;padding:0 10px 0 0;white-space:pre;cursor:pointer;border-left:2px solid transparent;transition:background .12s,opacity .12s}
.linklab-asmline i{display:inline-block;width:34px;margin-right:12px;text-align:right;font-style:normal;color:var(--ink-3);opacity:.65;user-select:none}
.linklab-asmline:hover{background:var(--surface);box-shadow:inset 2px 0 0 var(--rule)}
.linklab-asmline.dim{opacity:.32}
.linklab-asmline.active{background:var(--surface);box-shadow:inset 2px 0 0 var(--accent)}
.linklab-asmline.active i{color:var(--accent);opacity:1}
.linklab-asmline.picked{box-shadow:inset 2px 0 0 var(--ok);background:var(--surface)}
.linklab-asmline.picked i{color:var(--ok);opacity:1}
.linklab-asmdetail{min-height:150px;padding:11px 13px;border:1px solid var(--rule);background:var(--surface-2);font-size:13px;line-height:1.6;color:var(--ink-2)}
.linklab-asmdetail b{color:var(--ink)}
.linklab-asmhint{color:var(--ink-3);font-size:12px}
.linklab-asmpick{display:block;margin-bottom:7px;font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.linklab-regshead{margin:16px 0 8px;font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.linklab-regs{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px}
.linklab-regs>div{display:grid;grid-template-columns:46px minmax(0,1fr);gap:9px;padding:9px 11px;border:1px solid var(--rule);background:var(--surface-2);font-size:12px;line-height:1.55}
.linklab-regs b{font:600 12px var(--mono);color:var(--accent)}
.linklab-regs span{color:var(--ink-2)}

ont:10.5px/1.4 var(--mono);color:var(--ink-2)}.complab-arrow{display:grid;place-items:center;min-width:24px;color:var(--accent);font:700 14px var(--mono)}.complab-transform{display:grid;grid-template-columns:1fr 1fr;gap:8px}.complab-transform button,.complab-artifact button{display:grid;gap:4px;text-align:left;border:1px solid var(--rule-soft);background:var(--surface);padding:9px;color:var(--ink);cursor:pointer}.complab-transform button:hover,.complab-transform button.selected,.complab-artifact button:hover,.complab-artifact button.selected{border-color:var(--accent);background:var(--surface-2)}.complab-transform code,.complab-artifact code{font:600 10.5px var(--mono);color:var(--accent)}.complab-transform span,.complab-artifact span{font-size:10.5px;line-height:1.4;color:var(--ink-2)}.complab-detail{margin-top:10px;display:grid;gap:8px}.complab-detail div{display:grid;grid-template-columns:92px 1fr;gap:9px;padding:8px;border:1px solid var(--rule-soft);background:var(--surface)}.complab-detail b{font:600 9px var(--mono);text-transform:uppercase;color:var(--ink-3)}.complab-detail span{font-size:11px;line-height:1.45;color:var(--ink-2)}.complab-artifact{display:grid;gap:8px}.complab-artifact button{grid-template-columns:minmax(80px,max-content) 1fr;align-items:start}.complab-artifact code{white-space:nowrap}.complab-note{margin-top:12px;padding:10px 11px;border-left:3px solid var(--accent);background:var(--surface-2);font-size:12px;line-height:1.55;color:var(--ink-2)}.complab-check{margin-top:14px;border:1px solid var(--rule);background:var(--surface)}.complab-check-head{padding:9px 11px;border-bottom:1px solid var(--rule-soft);font:10px var(--mono);text-transform:uppercase;color:var(--ink-3)}.complab-check-body{padding:11px}.complab-choices{display:flex;flex-wrap:wrap;gap:7px}.complab-choices button{border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);padding:7px 9px;font:10.5px var(--mono);cursor:pointer}.complab-choices button.correct{border-color:var(--ok);color:var(--ok)}.complab-choices button.wrong{border-color:var(--warn);color:var(--warn)}.complab-answer{margin-top:9px;padding:9px;border:1px solid var(--rule-soft);background:var(--bg);font-size:11px;line-height:1.45;color:var(--ink-2)}.complab-tokens{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.complab-token{border:1px solid var(--rule-soft);background:var(--surface);padding:6px 8px;font:10.5px var(--mono)}.complab-token b{color:var(--accent)}

.pr-la svg{display:block;width:100%;height:auto;background:var(--bg);border:1px solid var(--rule-soft);border-radius:2px}
.pr-la .trace{fill:none;stroke:var(--accent);stroke-width:1.6}
.pr-la .grid{stroke:var(--rule-soft);stroke-dasharray:2 3}
.pr-la .segbox{fill:var(--surface-2);stroke:var(--rule)}
.pr-la .segbox.start,.pr-la .segbox.stop{fill:color-mix(in oklab, var(--ok) 14%, var(--surface));stroke:var(--ok)}
.pr-la .segbox.parity{fill:color-mix(in oklab, var(--violet) 14%, var(--surface));stroke:var(--violet)}
.pr-la .seglab{fill:var(--ink-2);font:7.5px var(--mono);text-anchor:middle}
.pr-la .play{stroke:var(--warn);stroke-width:1.4}
.pr-la .smp{fill:var(--ok)}
.pr-la .smp.bad{fill:var(--warn)}
.pr-la .clab{fill:var(--ink-3);font:9px var(--mono)}
.pr-la .idl{fill:var(--ink-3);font:8px var(--mono)}
.pr-read{font:11px var(--mono);color:var(--ink-2);margin-top:8px}
.pr-read b{color:var(--ink)}
.pr-read .bad{color:var(--warn)}
.pr-read .good{color:var(--ok)}
/* terminal */
.pr-term{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--rule-soft);border-radius:2px;padding:8px 10px;max-height:210px;overflow-y:auto}
.pr-term .row{display:grid;grid-template-columns:1fr 1fr 46px;gap:8px;padding:2px 0;border-bottom:1px dotted var(--rule-soft)}
.pr-term .row:last-child{border-bottom:0}
.pr-term .row .got{color:var(--ink)}
.pr-term .row.bad .got{color:var(--warn)}
.pr-term .k{color:var(--ink-3)}
.pr-termin{display:flex;gap:8px;margin-top:8px}
.pr-termin input{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;padding:7px 9px;border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.pr-termin input:focus{outline:none;border-color:var(--accent)}
/* family tier */
.pr-fams{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 0}
.pr-fam{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:6px 12px;cursor:pointer;border-radius:2px;transition:background .1s,color .1s,border-color .1s}
.pr-fam:hover{border-color:var(--accent);color:var(--ink)}
.pr-fam.cur{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pr-fam .fc{display:inline-flex;gap:3px}
.pr-fam .fc i{width:5px;height:5px;border-radius:50%;border:1px solid var(--ink-3);display:inline-block}
.pr-fam.cur .fc i{border-color:var(--surface)}
.pr-fam .fc i.gd{background:var(--ok);border-color:var(--ok)}
/* protocol lab tables */
table.pr-bit{width:100%;border-collapse:collapse;font:10.5px var(--mono);margin:6px 0}
table.pr-bit th,table.pr-bit td{padding:6px 8px;border-bottom:1px solid var(--rule-soft);text-align:left;vertical-align:top}
table.pr-bit th{background:var(--surface-2);color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:9px}
table.pr-bit td.k{color:var(--accent)}
table.pr-bit tr:last-child td{border-bottom:0}
table.pr-bit td.good{color:var(--ok)}
table.pr-bit td.bad{color:var(--warn)}
.pr-bit .rowlink{border:0;background:none;padding:0;color:var(--link);font:inherit;cursor:pointer;text-align:left;text-decoration:underline dotted}
.pr-bit .rowlink:hover{color:var(--accent)}
/* extra LA lanes + segment kinds */
.pr-la .trace.clk{stroke:var(--ink-3)}
.pr-la .trace.miso{stroke:var(--violet)}
.pr-la .segbox.data{fill:color-mix(in oklab, var(--steel) 12%, var(--surface))}
.pr-la .segbox.lost{fill:color-mix(in oklab, var(--warn) 20%, var(--surface));stroke:var(--warn)}
.pr-la .segbox.nack{fill:color-mix(in oklab, var(--warn) 16%, var(--surface));stroke:var(--warn)}
.pr-la .segbox.restart{fill:color-mix(in oklab, var(--violet) 16%, var(--surface));stroke:var(--violet)}
.pr-la .edge{fill:var(--ok)}
.pr-la .edge.bad{fill:var(--warn)}
.pr-la .elab{fill:var(--ink-3);font:7px var(--mono);text-anchor:middle}
/* register ring (SPI) */
.pr-ring{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.pr-ring .ff{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.pr-ring .ff b{width:20px;text-align:center;font:600 11px var(--mono);padding:5px 0;border-right:1px solid var(--rule-soft);background:var(--surface);color:var(--ink-3)}
.pr-ring .ff b:last-child{border-right:0}
.pr-ring .ff b.one{background:var(--accent);color:var(--surface)}
.pr-ring .ff b.nx{background:color-mix(in oklab, var(--violet) 30%, var(--surface));color:var(--ink)}
.pr-ring .arw{color:var(--accent);font:700 14px var(--mono)}
.pr-ring .rn{font:600 9px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);width:100%;text-align:center}
/* clock stretching (I2C stage 10) and the CAN stages */
.pr-la .segbox.stretch{fill:color-mix(in oklab, var(--warn) 20%, var(--surface));stroke:var(--warn)}
.pr-la .segbox.stuff{fill:color-mix(in oklab, var(--violet) 26%, var(--surface));stroke:var(--violet)}
.pr-wire .node.dom{fill:var(--accent);stroke:var(--accent)}
.pr-wire .node.rec{fill:none;stroke:var(--ink-3);stroke-dasharray:2 2}
.pr-stuff{justify-content:flex-start}
.pr-stuff .ff{flex-wrap:wrap;max-width:100%}
.pr-stuff .ff b{width:15px;font-size:9.5px}
.pr-stuff .ff b.st{background:color-mix(in oklab, var(--violet) 55%, var(--surface));color:var(--ink)}

</style>
